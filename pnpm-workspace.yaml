packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # msw's postinstall only installs its CLI helper — not needed at runtime
  # (msw is consumed as a library by the browser worker).
  msw: false
  sharp: false
  unrs-resolver: true
  # Prisma engine download + client postinstall generation (apps/api).
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  # esbuild binary setup (vitest).
  esbuild: true
  # SWC native binding (vitest decorator-metadata plugin).
  "@swc/core": true

# Supply-chain freshness policy: pnpm's minimumReleaseAge gates packages
# younger than the policy window. next@16.4.3 (and its lockstep companions)
# shipped 2026-10-23 and are deliberately exempted so the security bump that
# patches GHSA-2464-fhr4-w9xw / GHSA-673q-mjm6-r5xr / GHSA-p3m5-59mp-jv5r
# installs immediately instead of waiting out the freshness window.
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/eslint-plugin-next@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - eslint-config-next@16.4.3
  - next@16.4.3

# Security pins (MASTER QA audit + security audit 2026-10-19 partie 2 §2.38):
# every line forces the patched version of a known advisory, transitive or not.
overrides:
  fastify: 5.12.7
  # GHSA-v888 (deepmerge-ts stack exhaustion) — transitive via @prisma/config.
  deepmerge-ts: 8.0.0
  # GHSA-68fv (source-map-js event-loop DoS) — transitive via postcss/tailwind.
  source-map-js: 1.2.2
  # GHSA-wq5f (sharp librsvg CVE-2026-96889) — transitive via next.
  sharp: 0.35.5
  # GHSA-w74x-v6f9-j3xg / GHSA-wjr9-j795-jxcr (moderate) + GHSA-xhq7-xmqj-769h /
  # GHSA-333x-w4r6-6crp (low) — transitive via the Fastify stack (ajv /
  # fast-json-stringify / @fastify/ajv-compiler). Per-major pins keep each
  # resolution inside its original major line: zero API risk.
  'fast-uri@^3.0.0': ^3.1.9
  'fast-uri@^4.0.0': ^4.2.3
