<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="czTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141F3E"/>
      <stop offset="100%" stop-color="#0A1122"/>
    </linearGradient>
    <radialGradient id="czAurora" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#5A67F2" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#5A67F2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5A67F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="czArc" x1="15%" y1="85%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="45%" stop-color="#6E7BFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <radialGradient id="czCore" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#B7C2FF"/>
      <stop offset="45%" stop-color="#6E7BFF"/>
      <stop offset="100%" stop-color="#4049CE"/>
    </radialGradient>
    <radialGradient id="czHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#C7D2FE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
    <filter id="czGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Cosmoz deep-space tile -->
  <rect width="100" height="100" rx="23" fill="url(#czTile)"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="22.25" fill="none" stroke="#3A4A78" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect width="100" height="100" rx="23" fill="url(#czAurora)"/>
  <!-- Depth ring + orbit arc with comet head -->
  <circle cx="50" cy="52" r="33" fill="none" stroke="#6E7BFF" stroke-opacity="0.14" stroke-width="1"/>
  <path d="M 74.43 43.11 A 26 26 0 1 1 58.89 27.57" fill="none" stroke="url(#czArc)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Planet core -->
  <circle cx="50" cy="52" r="10.5" fill="url(#czCore)" filter="url(#czGlow)"/>
  <ellipse cx="46.6" cy="48" rx="4.4" ry="2.9" fill="#FFFFFF" opacity="0.3"/>
  <!-- Comet head -->
  <circle cx="58.89" cy="27.57" r="9" fill="url(#czHalo)"/>
  <circle cx="58.89" cy="27.57" r="4.4" fill="#FFFFFF" filter="url(#czGlow)"/>
  <!-- Starfield accents -->
  <circle cx="26" cy="64" r="1.6" fill="#8B96FF" opacity="0.75"/>
  <circle cx="71" cy="63" r="1.3" fill="#E6EBF5" opacity="0.6"/>
  <path d="M27 24.8 v6.4 M23.8 28 h6.4" stroke="#C7D2FE" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
</svg>
