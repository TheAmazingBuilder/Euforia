<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Euforia - Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1424;
        --surface: #121b2e;
        --border: #223050;
        --text: #e7ecf7;
        --muted: #8b97b0;
        --accent: #6e7bff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        width: min(28rem, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px;
        text-align: center;
      }
      .mark img {
        width: 88px; height: 88px;
        margin: 0 auto 20px;
        display: block;
        border-radius: 20px;
      }
      h1 { margin: 0 0 8px; font-size: 1.25rem; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; font-size: 0.875rem; line-height: 1.6; color: var(--muted); }
      button {
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--accent);
        font-size: 0.875rem;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      .hint { margin-top: 16px; font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">
        <img src="/brand/euforia-icon.svg" alt="Euforia logo" />
      </div>
      <h1>You are offline</h1>
      <p>
        Euforia could not reach the network. Your captured data is safe on this
        device - reconnect to sync your journal and the coach.
      </p>
      <button onclick="window.location.reload()">Try again</button>
      <p class="hint">Tip: the command palette (⌘K) works offline too.</p>
    </main>
  </body>
</html>
