# EUFORIA — CI (API, web, OCR service)
#
# Jobs:
#   api          → lint + typecheck + build + unit/e2e tests
#   web          → typecheck + unit tests + production build + tracked-secrets guard
#   ocr-service  → Python contract and pipeline tests
#
# The frontend MSW layer was removed. Web tests assert the real-API URL
# contract; no MSW worker or mock-leakage script is part of CI.

name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - euforia-collab
  pull_request:

jobs:
  api:
    name: api (lint · typecheck · build · unit + e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Production dependency security audit
        run: corepack pnpm audit --prod --audit-level high

      - name: Lint
        run: corepack pnpm --filter @cosmoz/api lint

      - name: Typecheck
        run: corepack pnpm --filter @cosmoz/api typecheck

      - name: Build
        run: corepack pnpm --filter @cosmoz/api build

      - name: Build production API image
        run: docker build -f apps/api/Dockerfile -t euforia-api:ci .

      - name: Verify production API image uses non-root runtime
        run: test "$(docker image inspect euforia-api:ci --format '{{.Config.User}}')" = "node"

      - name: Unit tests
        working-directory: apps/api
        env:
          CI: "true"
        run: corepack pnpm test

      - name: E2E tests (dedicated PostgreSQL)
        env:
          CI: "true"
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/euforia_test
        run: corepack pnpm --filter @cosmoz/api test:e2e

  web:
    name: web (typecheck · unit tests · build · secrets guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck shared + web
        run: |
          corepack pnpm --filter @cosmoz/shared exec tsc -p tsconfig.json --noEmit
          corepack pnpm --filter web exec tsc --noEmit

      - name: Lint
        run: corepack pnpm --filter web lint

      - name: Unit tests
        run: corepack pnpm --filter web exec vitest run

      - name: Build
        run: corepack pnpm --filter web exec next build

      - name: Tracked-secrets guard (working tree)
        working-directory: apps/web
        run: node scripts/check-tracked-secrets.mjs

  ocr-service:
    name: ocr-service (pytest — sidecar pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tesseract (system binary + English data)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        working-directory: mini-services/ocr-service
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (sidecar pipeline, V1+V2 contract)
        working-directory: mini-services/ocr-service
        run: python3 -m pytest tests/ -q

  market-service:
    name: market-service (Bun tests · TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install market-service dependencies
        working-directory: mini-services/market-service
        run: bun install --frozen-lockfile

      - name: Market provider tests
        working-directory: mini-services/market-service
        run: bun test

      - name: Market service typecheck
        run: corepack pnpm --filter web exec tsc --noEmit --project ../../mini-services/market-service/tsconfig.json
