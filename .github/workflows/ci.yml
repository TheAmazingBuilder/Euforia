# COSMOZ — CI (Foundation + finalization)
#
# Jobs:
#   api   → lint + typecheck + build + full test suite (unit + e2e against a
#           real PostgreSQL service container; the suite requires the
#           dedicated euforia_test database via TEST_DATABASE_URL and refuses
#           to run against any other database).
#   web   → regression guard: the frontend still typechecks and BUILDS with
#           the backend changes in the tree (Phase 1 mandate §35; the build
#           was unblocked during finalization by the /login Suspense fix).

name: ci

# Least-privilege pipelines (security-audit 2026-10-19 §2.20): the CI only
# reads the repository — no write scope is ever granted.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api:
    name: api (lint · typecheck · build · test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: euforia_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Create dedicated test database
        env:
          PGPASSWORD: postgres
        run: psql "postgresql://postgres@127.0.0.1:5432/postgres" -c 'CREATE DATABASE euforia_test;'

      - name: Install dependencies
        # apps/api has a "postinstall": "prisma generate" — fresh clones don't
        # ship a generated Prisma client (verified 2026-10-17: a clean clone
        # failed the Typecheck step without it).
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm --filter @cosmoz/api lint

      - name: Typecheck
        run: corepack pnpm --filter @cosmoz/api typecheck

      - name: Build
        run: corepack pnpm --filter @cosmoz/api build

      - name: Test (unit + e2e, external PostgreSQL service)
        working-directory: apps/api
        env:
          CI: "true"
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/euforia_local_dev"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/euforia_test"
        run: corepack pnpm test

  web:
    name: web (regression — typecheck + unit + build + mock-leakage guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck shared + web
        run: |
          corepack pnpm --filter @cosmoz/shared exec tsc -p tsconfig.json --noEmit
          corepack pnpm --filter web exec tsc --noEmit

      - name: Unit tests (logic + API-mode matrix)
        run: corepack pnpm --filter web exec vitest run

      # `next build` was blocked at prerendering /login (useSearchParams
      # without a Suspense boundary — pre-existing since Phase 1, documented
      # in the Phase 1 report). Fixed during the finalization mission; the
      # build now runs in CI as a full frontend regression guard.
      - name: Build
        run: corepack pnpm --filter web exec next build

      # MASTER QA spec §14.10 — automated guard against accidental mock
      # activation in production: a production bundle must NOT contain the
      # MSW worker bootstrap reachable from the default mode (the canonical
      # mode matrix keeps zero-env production on the real API; the explicit
      # demo opt-in compiles mocks in, so this guard checks the DEFAULT
      # build). The client build inlines NODE_ENV=production → API_MOCKED
      # must statically resolve to false → the dynamic `import("@/mocks/
      # browser")` never executes. We assert the guard TEST (mode.spec) and
      # grep the built client chunks for an unconditional worker start.
      - name: Mock-leakage guard (production build)
        # The guard resolves src/, public/ and .next/ from process.cwd() —
        # it lives in apps/web and must run from there (Phase 12 audit: the
        # original root-relative invocation failed with MODULE_NOT_FOUND).
        working-directory: apps/web
        run: node scripts/check-prod-mock-leakage.mjs

      # Security-audit 2026-10-19 §2.20 — tracked-secrets scan of the whole
      # working tree (git ls-files; history is out of scope by design, see
      # the audit report). Runs in the web job because that job already
      # carries the repo-wide guard scripts; zero dependencies.
      - name: Tracked-secrets guard (working tree)
        working-directory: apps/web
        run: node scripts/check-tracked-secrets.mjs

  ocr-service:
    name: ocr-service (pytest — sidecar pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tesseract (system binary + English data)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        working-directory: mini-services/ocr-service
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (sidecar pipeline, V1+V2 contract)
        working-directory: mini-services/ocr-service
        run: python3 -m pytest tests/ -q
