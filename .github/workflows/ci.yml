# COSMOZ — CI (Foundation)
#
# Jobs:
#   api   → lint + typecheck + build + full test suite (unit + e2e with a real
#           PostgreSQL via the embedded dev/test binaries — no service
#           container needed; the suite self-manages cosmoz_test and refuses
#           to run against any other database).
#   web   → regression guard: the frontend still typechecks and builds with
#           the backend changes in the tree (Phase 1 mandate §35).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (lint · typecheck · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm --filter @cosmoz/api lint

      - name: Typecheck
        run: corepack pnpm --filter @cosmoz/api typecheck

      - name: Build
        run: corepack pnpm --filter @cosmoz/api build

      - name: Test (unit + e2e, embedded PostgreSQL)
        working-directory: apps/api
        env:
          CI: "true"
        run: corepack pnpm test

  web:
    name: web (regression — typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck shared + web
        run: |
          corepack pnpm --filter @cosmoz/shared exec tsc -p tsconfig.json --noEmit
          corepack pnpm --filter web exec tsc --noEmit

      # NOTE: `next build` currently fails at prerendering /login due to a
      # PRE-EXISTING frontend issue (useSearchParams without a Suspense
      # boundary — a Next.js CSR bailout, unrelated to the backend
      # foundation; reproduced with zero backend files involved). Fixing it
      # is frontend work outside the backend mandate — see
      # docs/backend/PHASE-1-FOUNDATION-REPORT.md §Remaining Risks.
