# EUFORIA — CI (API, web, OCR service)
#
# Jobs:
#   api          → lint + typecheck + build + unit/e2e tests
#   web          → typecheck + unit tests + production build + tracked-secrets guard
#   ocr-service  → Python contract and pipeline tests
#
# The frontend MSW layer was removed. Web tests assert the real-API URL
# contract; no MSW worker or mock-leakage script is part of CI.

name: ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - euforia-collab
  pull_request:

jobs:
  api:
    name: api (lint · typecheck · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm --filter @cosmoz/api lint

      - name: Typecheck
        run: corepack pnpm --filter @cosmoz/api typecheck

      - name: Build
        run: corepack pnpm --filter @cosmoz/api build

      - name: Test (unit + e2e, embedded PostgreSQL)
        working-directory: apps/api
        env:
          CI: "true"
        run: corepack pnpm test

  web:
    name: web (typecheck · unit tests · build · secrets guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck shared + web
        run: |
          corepack pnpm --filter @cosmoz/shared exec tsc -p tsconfig.json --noEmit
          corepack pnpm --filter web exec tsc --noEmit

      - name: Unit tests
        run: corepack pnpm --filter web exec vitest run

      - name: Build
        run: corepack pnpm --filter web exec next build

      - name: Tracked-secrets guard (working tree)
        working-directory: apps/web
        run: node scripts/check-tracked-secrets.mjs

  ocr-service:
    name: ocr-service (pytest — sidecar pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tesseract (system binary + English data)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        working-directory: mini-services/ocr-service
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest (sidecar pipeline, V1+V2 contract)
        working-directory: mini-services/ocr-service
        run: python3 -m pytest tests/ -q
